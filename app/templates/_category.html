{% macro category_select(current) -%}
      <select name="category" id="category-select" data-custom="__custom__">
        <option value="">{{ t("category.none") }}</option>
        {% if orphan_category %}
        <option value="{{ orphan_category }}" selected>{{ orphan_category }} — {{ t("category.missing_in_client") }}</option>
        {% endif %}
        {% for category in categories %}
        <option value="{{ category.name }}" data-path="{{ category.effective_path }}"
                {% if category.name == current %}selected{% endif %}>
          {{ category.name }}{% if category.effective_path %} — {{ category.effective_path }}{% endif %}
        </option>
        {% endfor %}
        <option value="__custom__">{{ t("category.custom") }}</option>
      </select>
      <div class="category-custom" id="category-custom-block" hidden>
        <input name="category_custom" id="category-custom" placeholder="{{ t('category.custom_placeholder') }}">
        <input name="category_custom_path" id="category-custom-path"
               placeholder="{{ t('category.custom_path_placeholder') }}">
        <span class="hint">{{ t("category.custom_path_hint") }}</span>
      </div>
{%- endmacro %}
