<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{ title or "torrent-watchdog" }}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% set path = request.url.path %}
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">tw</span><span>torrent-watchdog</span></a>
    <nav>
      <a href="/" {% if path == "/" %}class="on"{% endif %}>Раздачи</a>
      <a href="/add" {% if path == "/add" %}class="on"{% endif %}>Добавить</a>
      <a href="/settings" {% if path == "/settings" %}class="on"{% endif %}>Настройки</a>
      <a href="/logs" {% if path == "/logs" %}class="on"{% endif %}>Журнал</a>
      <form method="post" action="/logout" class="logout"><button>Выйти</button></form>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">{{ app_name }} v{{ app_version }}</footer>
  <script src="/static/app.js"></script>
</body>
</html>
