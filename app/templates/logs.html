{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Логи событий</h1>
  <form class="filters" method="get">
    <input name="event_type" value="{{ event_type or '' }}" placeholder="event_type">
    <select name="tracked_id">
      <option value="">Все раздачи</option>
      {% for t in torrents %}<option value="{{ t.id }}" {% if tracked_id == t.id %}selected{% endif %}>{{ t.title }}</option>{% endfor %}
    </select>
    <button>Фильтр</button>
  </form>
  <div class="events">
    {% for e in events %}
    <div class="event {{ e.event_type }}"><time>{{ e.created_at|dt }}</time><strong>{{ event_label.get(e.event_type, e.event_type) }}</strong><span>{{ e.message }}</span></div>
    {% endfor %}
  </div>
</section>
{% endblock %}
