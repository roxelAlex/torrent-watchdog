services:
  flaresolverr:
    # Свой образ, а не стандартный FlareSolverr: он умеет отдавать только HTML,
    # а dl.php RuTracker возвращает файл. Подробности — в README.
    image: ${IMAGE_PREFIX:-roxelalex}/torrent-watchdog-flaresolverr:${IMAGE_TAG:-latest}
    container_name: torrent-watchdog-flaresolverr
    # Имя `flaresolverr` в сети — не косметика: по нему приложение отличает наш
    # образ от обычного FlareSolverr и включает endpoint скачивания. Задаём его
    # явно, иначе при заданном container_name алиас по имени сервиса пропадает.
    networks:
      default:
        aliases:
          - flaresolverr
    environment:
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=info
    restart: unless-stopped

  torrent-watchdog:
    image: ${IMAGE_PREFIX:-roxelalex}/torrent-watchdog:${IMAGE_TAG:-latest}
    container_name: torrent-watchdog
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8096}:${APP_PORT:-8096}"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-UTC}
    depends_on:
      - flaresolverr
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-8096}/health"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
