services:
  flaresolverr:
    build:
      context: .
      dockerfile: Dockerfile.flaresolverr
    image: torrent-watchdog-flaresolverr
    container_name: torrent-watchdog-flaresolverr
    environment:
      - TZ=${TZ:-Asia/Yekaterinburg}
      - LOG_LEVEL=info
    restart: unless-stopped

  torrent-watchdog:
    build: .
    container_name: torrent-watchdog
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8096}:${APP_PORT:-8096}"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-Asia/Yekaterinburg}
    depends_on:
      - flaresolverr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3
