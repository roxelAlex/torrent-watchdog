name: release

# Публикация по тегу версии: git tag v0.7.5 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY_USER: roxelalex

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Тег и файл VERSION должны совпадать, иначе образ уедет под чужим номером.
      - name: Тег совпадает с VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          echo "тег: $tag, VERSION: $file"
          test "$tag" = "$file"
      # Пустой секрет выглядит как заданный: имя в списке есть, значения нет.
      # Без этой проверки узнать о нём можно было бы только по «Password required»
      # после нескольких минут сборки.
      - name: Секреты реестра заданы
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Пустые или отсутствующие секреты:$missing"
            echo "Задайте их в Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "оба секрета непустые"

  publish:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      # Падение одного образа не должно отменять сборку второго.
      fail-fast: false
      matrix:
        include:
          - image: torrent-watchdog
            dockerfile: Dockerfile
            description: Следит за обновлениями раздач RuTracker и применяет их в qBittorrent
          - image: torrent-watchdog-flaresolverr
            dockerfile: Dockerfile.flaresolverr
            description: FlareSolverr с endpoints скачивания и входа для torrent-watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_USER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Описание на Docker Hub обновляется теми же секретами, что и публикация:
      # отдельный файл, потому что README не влезает в лимит в 25000 знаков.
      # Косметика не должна ронять релиз: токен уровня Read & Write не даёт
      # править метаданные репозитория, и это не повод не публиковать образ.
      - name: Описание на Docker Hub
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_USER }}/${{ matrix.image }}
          short-description: ${{ matrix.description }}
          readme-filepath: ./docs/dockerhub.md
